<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CraveAI — Discover the Best Food</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────────────── -->
  <header class="header">
    <div class="header-inner container">
      <div class="logo-group">
        <div class="logo-icon">C</div>
        <div class="logo-text">CraveAI</div>
      </div>
      <div class="header-actions">
        <span style="color: var(--zomato-gray); font-size: 0.9rem; font-weight: 500;">Log in</span>
      </div>
    </div>
  </header>

  <!-- ── HERO SECTION ─────────────────────────────────────── -->
  <section class="hero">
    <div class="hero-content container">
      <h1 class="hero-title">Find the best restaurants, cafés, and bars</h1>
      <p class="hero-sub">AI-powered discovery for the perfect meal</p>
    </div>
  </section>

  <!-- ── SEARCH / FILTERS ─────────────────────────────────── -->
  <div class="search-container container">
    <div class="search-card">
      <div class="filter-row">
        <div class="filter-group">
          <label class="filter-label">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Location
          </label>
          <input id="input-location" class="filter-input" type="text" placeholder="e.g. Bangalore, BTM" value="Bellandur" />
        </div>
        
        <div class="filter-group">
          <label class="filter-label">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
            Cuisine
          </label>
          <select id="input-cuisines" class="filter-input">
            <option value="Italian, Indian">Popular Mix</option>
            <option value="North Indian">North Indian</option>
            <option value="South Indian">South Indian</option>
            <option value="Chinese">Chinese</option>
            <option value="Italian">Italian</option>
            <option value="Continental">Continental</option>
            <option value="Thai">Thai</option>
            <option value="Mexican">Mexican</option>
            <option value="Japanese">Japanese</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Budget</label>
          <div class="budget-tabs">
            <button class="budget-tab" data-value="low">Low</button>
            <button class="budget-tab active" data-value="medium">Mid</button>
            <button class="budget-tab" data-value="high">High</button>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Rating (<span id="rating-val">3.5</span>+)</label>
          <input id="input-rating" class="rating-slider" type="range" min="0" max="5" step="0.1" value="3.5" />
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label">What are you looking for?</label>
        <input id="input-prefs" class="filter-input" type="text" placeholder="e.g. Rooftop seating, quiet atmosphere, live music..." />
      </div>

      <button id="btn-recommend" class="btn-search">
        <span id="btn-text">Discover Restaurants</span>
      </button>
    </div>
  </div>

  <!-- ── MAIN CONTENT ───────────────────────────────────── -->
  <main class="main container">
    <div id="results-header" style="display:none; margin-bottom: 24px;">
      <h2 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em;">Recommended for You</h2>
    </div>

    <div id="results-grid" class="results-grid"></div>

    <div id="loading-state" class="loading-overlay" style="display:none;">
      <div class="spinner"></div>
      <p style="font-weight: 600; color: var(--zomato-gray);">Searching for the perfect spots...</p>
    </div>

    <div id="empty-state" class="loading-overlay">
      <p style="color: var(--zomato-gray);">Start your search to see personalized AI recommendations.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
